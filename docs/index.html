<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금오공대 알림</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#e3e3e3;--new:#fff3b0}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--new:#4a4220}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg);cursor:pointer}
li{list-style:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
li.new{background:var(--new)}
li.old{opacity:.55}
ul{padding:0}
a{color:inherit}
.meta{color:var(--mut);font-size:.85rem}
.badge{font-size:.7rem;font-weight:700;border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-right:6px}
</style>
</head>
<body>
<main>
  <h1>금오공대 새 글 알림</h1>
  <div class="sub" id="sub">불러오는 중...</div>
  <button id="perm">브라우저 알림 켜기</button>
  <a href="https://biskit.kumoh.ac.kr/" target="_blank" rel="noopener" style="margin-left:8px">BISKIT 열기</a>
  <ul id="list"></ul>
</main>
<script>
const $ = id => document.getElementById(id);
let known = null;
const fmt = t => new Date(t*1000).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});

async function load(){
  try{
    const r = await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    const d = await r.json();
    const now = Date.now()/1000;
    $("sub").textContent = "마지막 변경: "+fmt(d.updated)+" · 이 탭을 열어두면 5분마다 새로 확인합니다";
    $("list").innerHTML = "";
    for(const i of d.items){
      const isNew = now - i.first_seen < 48*3600;
      const li = document.createElement("li");
      li.className = (isNew && i.active ? "new " : "") + (i.active ? "" : "old");
      const t = document.createElement("div");
      const tag = document.createElement("span"); tag.className="badge"; tag.textContent = (isNew && i.active ? "NEW · " : "") + (i.label||"비교과"); t.appendChild(tag);
      if(i.url && i.source!=="biskit"){ const a=document.createElement("a"); a.href=i.url; a.target="_blank"; a.rel="noopener"; a.textContent=i.title; t.appendChild(a); }
      else t.appendChild(document.createTextNode(i.title));
      const m = document.createElement("div");
      m.className = "meta";
      const info = i.source==="biskit" ? "신청기간 "+i.period : (i.date||"");
      m.textContent = info+" · 발견 "+fmt(i.first_seen)+(i.active?"":" · 목록에서 사라짐");
      li.append(t,m);
      $("list").appendChild(li);
    }
    const keys = new Set(d.items.map(i=>i.key));
    if(known && Notification.permission==="granted"){
      d.items.filter(i=>!known.has(i.key)).forEach(i=>new Notification("새 "+(i.label||"비교과"),{body:i.title}));
    }
    known = keys;
  }catch(e){ $("sub").textContent = "데이터를 불러오지 못했어요 (아직 첫 실행 전일 수 있어요)"; }
}
$("perm").onclick = async () => {
  const p = await Notification.requestPermission();
  $("perm").textContent = p==="granted" ? "브라우저 알림 켜짐" : "알림이 차단됨";
};
load(); setInterval(load, 5*60*1000);
</script>
</body>
</html>
